<div style="padding: 20px;">
  <h2>Your Booking History</h2>
  <table border="1" style="width: 100%;" *ngIf="history.length > 0">
    <tr>
      <th>Room Type</th>
      <th>Price</th>
      <th>Booking Time</th>
    </tr>
    <tr *ngFor="let item of history">
      <td>{{ item.type }}</td>
      <td>₹{{ item.price }}</td>
      <td>{{ item.lastBooked }}</td>
    </tr>
  </table>
  <p *ngIf="history.length === 0">No bookings yet.</p>
</div>
