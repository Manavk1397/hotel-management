<div style="background-color: #f0f0f0; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
  <p>Room Type: <input type="text" [(ngModel)]="rType"></p>
  <p>Price: <input type="number" [(ngModel)]="rPrice"></p>
  <button (click)="onUpload()">Upload Room Details</button>
</div>

<div style="display: flex; flex-wrap: wrap;">
  <div *ngFor="let room of hotelService.rooms; let i = index">
    <app-roomcard 
      [roomData]="room" 
      buttonLabel="Delete Room" 
      (cardAction)="hotelService.deleteRoom(i)">
    </app-roomcard>
  </div>
</div>
