<div style="border: 1px solid #ccc; padding: 15px; margin: 10px; border-radius: 8px; width: 250px; background-color: #fff; box-shadow: 2px 2px 5px rgba(0,0,0,0.1);">
  <img *ngIf="roomData?.image" [src]="roomData.image" alt="Room Photo" style="width: 100%; height: 150px; object-fit: cover; border-radius: 4px; margin-bottom: 10px;">

  <h3>{{ roomData.type }}</h3>
  
  <p style="color: #666; font-size: 0.9em; margin-bottom: 10px;">{{ roomData.description }}</p>

  <p><strong>Price:</strong> ₹{{ roomData.price }}</p>
  
  <p *ngIf="roomData.count > 0">Available: {{ roomData.count }}</p>
  <p *ngIf="roomData.count === 0" style="color: red; font-weight: bold;">Sold Out</p>
  
  <button 
    [disabled]="roomData.count === 0" 
    (click)="onBtnClick()"
    style="padding: 8px 16px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px; width: 100%;">
    {{ buttonLabel }}
  </button>
</div>
