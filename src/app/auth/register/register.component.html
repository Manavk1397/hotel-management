<div style="padding: 20px; border: 1px solid #ccc; width: 350px; margin: auto; margin-top: 50px;">
  <h2>User Registration</h2>
  <form #regForm="ngForm" (ngSubmit)="onRegister(regForm)">
    
    <p>Full Name: <br>
      <input type="text" name="fullName" ngModel required #nameRef="ngModel">
      <span *ngIf="nameRef.invalid && nameRef.touched" style="color: red; font-size: 12px;">Name is required</span>
    </p>

    <p>Email: <br>
      <input type="email" name="email" ngModel required email #emailRef="ngModel">
      <span *ngIf="emailRef.invalid && emailRef.touched" style="color: red; font-size: 12px;">Valid email is required</span>
    </p>

    <p>Password: <br>
      <input type="password" name="password" ngModel required minlength="6" #passRef="ngModel">
      <span *ngIf="passRef.invalid && passRef.touched" style="color: red; font-size: 12px;">Password (min 6 chars) required</span>
    </p>

    <p>Register As: <br>
      <select name="role" ngModel required #roleRef="ngModel" style="width: 100%; padding: 5px;">
        <option value="customer">Customer</option>
        <option value="admin">Admin</option>
      </select>
      <span *ngIf="roleRef.invalid && roleRef.touched" style="color: red; font-size: 12px;">Please select a role</span>
    </p>

    <button type="submit" [disabled]="regForm.invalid">Register</button>
  </form>

  <p><a routerLink="/auth/login">Already have an account? Login</a></p>
</div>
