<div style="padding: 20px;">
  <h2>Booking History</h2>
  <table *ngIf="myBookings.length > 0" border="1" style="width: 100%; text-align: left;">
    <tr>
      <th>Type</th>
      <th>Price</th>
      <th>Time Booked</th>
    </tr>
    <tr *ngFor="let b of myBookings">
      <td>{{ b.type }}</td>
      <td>₹{{ b.price }}</td>
      <td>{{ b.lastBooked }}</td> </tr>
  </table>
  <p *ngIf="myBookings.length === 0">No bookings found.</p>
</div>
