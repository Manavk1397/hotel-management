<div style="padding: 20px; border: 1px solid #ccc; width: 300px; margin: auto; margin-top: 50px;">
  <h2>Hotel Login</h2>
  
  <p>Email: <br>
    <input type="text" [(ngModel)]="email" placeholder="Enter your email">
  </p>
  
  <p>Password: <br>
    <input type="password" [(ngModel)]="password" placeholder="Enter your password">
  </p>
  
  <button (click)="onLogin()">Login</button>
  
  <hr>
  <p>Demo Admin: admin@hotel.com / admin123</p>
  <p>Demo User: user@hotel.com / user123</p>
</div>
