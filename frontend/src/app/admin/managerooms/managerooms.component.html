<div style="background-color: #f0f0f0; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
  <p>Room Type: <input type="text" #tInput placeholder="e.g. Deluxe"></p>
  <p>Price: <input type="number" #pInput></p>
  
  <button (click)="onUpload(tInput.value, pInput.value); tInput.value=''; pInput.value=''">
    Upload Room Details
  </button>
</div>

<div style="display: flex; flex-wrap: wrap;">
  <div *ngFor="let room of rooms">
    <app-roomcard 
      [roomData]="room" 
      buttonLabel="Delete Room" 
      (cardAction)="deleteRoom($event)">
    </app-roomcard>
  </div>
</div>
